<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Gravity Runner - Pufutara</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #eaeaea;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: Arial, sans-serif;
}

canvas {
  background: #fff;
  border: 3px solid #000;
  border-radius: 8px;
}

.btn-close {
  position: fixed;
  top: 12px;
  left: 12px;
  width: 38px;
  height: 38px;
  background: #fff;
  border: 2px solid #000;
  border-radius: 50%;
  font-size: 20px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  color: #000;
}

.btn-close:hover {
  background: #000;
  color: #fff;
}
</style>
</head>
<body>

<a href="index.html" class="btn-close">✕</a>

<canvas id="game" width="420" height="240"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player, obstacles;
let gravity = 0.45;          // ⬅ lebih santai
let flip = 1;
let speed = 2.6;             // ⬅ awal lebih lambat
let score = 0;
let highScore = localStorage.getItem("gravityHigh") || 0;
let gameOver = false;
let started = false;

/* INIT */
function resetGame() {
  player = {
    x: 40,
    y: canvas.height / 2,
    r: 9,
    vy: 0
  };

  obstacles = [];
  score = 0;
  speed = 2.6;
  flip = 1;
  gameOver = false;
}

/* INPUT */
document.addEventListener("keydown", e => {
  if (e.code === "Space") {
    if (!started) {
      started = true;
      resetGame();
      return;
    }

    if (gameOver) {
      resetGame();
      return;
    }

    flip *= -1;
    player.vy = -7 * flip;   // ⬅ lompat lebih halus
  }
});

/* SPAWN OBSTACLE */
function spawnObstacle() {
  const rand = Math.random();

  // 🔥 BLOK TENGAH (JARANG)
  if (rand < 0.004) {
    obstacles.push({
      x: canvas.width,
      y: canvas.height / 2 - 18,
      w: 18,
      h: 36,
      type: "mid"
    });
    return;
  }

  // 🔲 BLOK ATAS / BAWAH (NORMAL)
  const top = Math.random() > 0.5;
  obstacles.push({
    x: canvas.width,
    y: top ? 0 : canvas.height - 18,
    w: 14,
    h: 18,
    type: "edge"
  });
}

/* COLLISION */
function hitCircleRect(c, r) {
  const cx = Math.max(r.x, Math.min(c.x, r.x + r.w));
  const cy = Math.max(r.y, Math.min(c.y, r.y + r.h));
  const dx = c.x - cx;
  const dy = c.y - cy;
  return dx * dx + dy * dy < c.r * c.r;
}

/* LOOP */
function update() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#000";

  /* CEILING & FLOOR */
  ctx.fillRect(0, 0, canvas.width, 2);
  ctx.fillRect(0, canvas.height - 2, canvas.width, 2);

  if (!started) {
    ctx.textAlign = "center";
    ctx.fillText("TEKAN SPACE UNTUK MULAI", canvas.width / 2, canvas.height / 2);
    ctx.textAlign = "left";
    requestAnimationFrame(update);
    return;
  }

  if (!gameOver) {
    player.vy += gravity * flip;
    player.y += player.vy;
  }

  /* LIMIT */
  if (player.y - player.r < 2) {
    player.y = player.r + 2;
    player.vy = 0;
  }

  if (player.y + player.r > canvas.height - 2) {
    player.y = canvas.height - player.r - 2;
    player.vy = 0;
  }

  /* PLAYER */
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
  ctx.fill();

  /* OBSTACLES */
  obstacles.forEach(o => {
    o.x -= speed;

    // beda visual dikit buat blok tengah
    if (o.type === "mid") {
      ctx.globalAlpha = 0.85;
    }

    ctx.fillRect(o.x, o.y, o.w, o.h);
    ctx.globalAlpha = 1;

    if (hitCircleRect(player, o)) {
      gameOver = true;
    }
  });

  obstacles = obstacles.filter(o => o.x + o.w > 0);

  /* SPAWN (lebih jarang) */
  if (Math.random() < 0.018 && !gameOver) spawnObstacle();

  /* SCORE + SPEED */
  if (!gameOver) {
    score++;
    speed = 2.6 + score * 0.003; // ⬅ naik pelan

    if (score > highScore) {
      highScore = score;
      localStorage.setItem("gravityHigh", highScore);
    }
  }

  ctx.font = "14px Arial";
  ctx.fillText("Score: " + score, 8, 18);
  ctx.fillText("High: " + highScore, 8, 34);

  if (gameOver) {
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 6);
    ctx.fillText("SPACE UNTUK ULANG", canvas.width / 2, canvas.height / 2 + 12);
    ctx.textAlign = "left";
  }

  requestAnimationFrame(update);
}

update();

</script>

</body>
</html>
