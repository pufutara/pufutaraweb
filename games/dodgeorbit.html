<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Orbit Dodge - Pufutara</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #eaeaea;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: Arial, sans-serif;
}

canvas {
  background: #fff;
  border: 3px solid #000;
  border-radius: 8px;
}

.btn-close {
  position: fixed;
  top: 12px;
  left: 12px;
  width: 38px;
  height: 38px;
  background: #fff;
  border: 2px solid #000;
  border-radius: 50%;
  font-size: 20px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  color: #000;
}

.btn-close:hover {
  background: #000;
  color: #fff;
}
</style>
</head>
<body>

<a href="index.html" class="btn-close">✕</a>

<!-- AREA GAME DIPERBESAR -->
<canvas id="game" width="720" height="420"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const cx = canvas.width / 2;
const cy = canvas.height / 2;

let angle = 0;
let dir = 1;
let baseRadius = 55;
let orbitRadius = baseRadius;
let radiusPhase = 0;

let speed = 0.03;
let score = 0;
let high = localStorage.getItem("orbitHigh") || 0;
let obstacles = [];
let started = false;
let gameOver = false;

/* INPUT */
document.addEventListener("keydown", e => {
  if (e.code === "Space") {
    if (!started) {
      started = true;
      reset();
      return;
    }
    if (gameOver) {
      reset();
      return;
    }
    dir *= -1;
  }
});

function reset() {
  angle = 0;
  dir = 1;
  speed = 0.03;
  score = 0;
  obstacles = [];
  radiusPhase = 0;
  gameOver = false;
}

/* SPAWN OBSTACLE */
function spawnObstacle() {
  obstacles.push({
    angle: Math.random() * Math.PI * 2,
    dist: Math.max(canvas.width, canvas.height),
    size: 8
  });
}

/* LOOP */
function update() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#000";

  ctx.strokeRect(6, 6, canvas.width - 12, canvas.height - 12);

  if (!started) {
    ctx.textAlign = "center";
    ctx.fillText("TEKAN SPACE UNTUK MULAI", cx, cy);
    ctx.textAlign = "left";
    requestAnimationFrame(update);
    return;
  }

  if (!gameOver) {
    angle += speed * dir;
    radiusPhase += 0.015;
    orbitRadius = baseRadius + Math.sin(radiusPhase) * 14;
  }

  const px = cx + Math.cos(angle) * orbitRadius;
  const py = cy + Math.sin(angle) * orbitRadius;

  ctx.beginPath();
  ctx.arc(px, py, 7, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(cx, cy, 3, 0, Math.PI * 2);
  ctx.fill();

  obstacles.forEach(o => {
    o.dist -= 1.8;

    const ox = cx + Math.cos(o.angle) * o.dist;
    const oy = cy + Math.sin(o.angle) * o.dist;

    ctx.fillRect(ox - o.size / 2, oy - o.size / 2, o.size, o.size);

    const dx = px - ox;
    const dy = py - oy;
    if (dx * dx + dy * dy < 13 * 13) gameOver = true;
  });

  obstacles = obstacles.filter(o => o.dist > orbitRadius - 5);

  if (Math.random() < 0.025 && !gameOver) spawnObstacle();

  if (!gameOver) {
    score++;
    speed += 0.00001;
    if (score > high) {
      high = score;
      localStorage.setItem("orbitHigh", high);
    }
  }

  ctx.font = "14px Arial";
  ctx.fillText("Score: " + score, 8, 18);
  ctx.fillText("High: " + high, 8, 34);

  if (gameOver) {
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", cx, cy - 6);
    ctx.fillText("SPACE UNTUK ULANG", cx, cy + 12);
    ctx.textAlign = "left";
  }

  requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
