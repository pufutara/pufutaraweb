.page-header{
  text-align:center;

}
@keyframes fadeDown{

}

/* PLAYER */
.player-box{
  max-width:360px;
  margin:10px auto 0;
  padding:18px;
  border-radius:16px;
  background:rgba(0,0,0,.03);
}
audio{width:100%;margin-bottom:12px}

/* PLAYLIST */
.playlist{
  list-style:none;
  padding:0;
  margin:0;
  text-align:left;
}
.playlist li{
  padding:10px;
  border-radius:10px;
  cursor:pointer;
  font-size:.9rem;
}
.playlist li:hover{
  background:rgba(0,0,0,.06);
}
.playlist li.active{
  background:#000;
  color:#fff;
}
