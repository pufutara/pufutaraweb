<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Flappy Bird - Simple Style</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    background: #f2f2f2;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
  }

  canvas {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  }
</style>
</head>
<body>

<canvas id="game" width="360" height="520"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// ===== AUDIO =====
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playScoreSound() {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "sine";
  osc.frequency.value = 900;
  gain.gain.value = 0.15;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.08);
}

function playGameOverSound() {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "square";
  osc.frequency.value = 200;
  gain.gain.value = 0.2;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.25);
}

// ===== GAME CONST =====
const GRAVITY = 0.4;
const JUMP = -7;
const PIPE_WIDTH = 50;
const PIPE_GAP = 130;
const PIPE_DISTANCE = 170;

let bird = {
  x: 90,
  y: canvas.height / 2,
  r: 10,
  vy: 0
};

let pipes = [];
let frame = 0;
let score = 0;
let highScore = Number(localStorage.getItem("flappyHighScore")) || 0;
let gameOver = false;
let canRestart = false;

// PIPE
function spawnPipe() {
  const topHeight = Math.random() * 180 + 40;
  pipes.push({
    x: canvas.width,
    top: topHeight,
    bottom: canvas.height - topHeight - PIPE_GAP,
    passed: false
  });
}

// RESET
function resetGame() {
  bird.y = canvas.height / 2;
  bird.vy = 0;
  pipes = [];
  frame = 0;
  score = 0;
  gameOver = false;
  canRestart = false;
}

// END GAME
function endGame() {
  if (gameOver) return;
  gameOver = true;

  playGameOverSound();

  if (score > highScore) {
    highScore = score;
    localStorage.setItem("flappyHighScore", highScore);
  }

  setTimeout(() => canRestart = true, 1000);
}

// UPDATE
function update() {
  if (gameOver) return;

  frame++;

  bird.vy += GRAVITY;
  bird.y += bird.vy;

  if (bird.y < bird.r || bird.y > canvas.height - bird.r) {
    endGame();
  }

  if (frame % PIPE_DISTANCE === 0) spawnPipe();

  pipes.forEach(p => p.x -= 2.2);
  pipes = pipes.filter(p => p.x + PIPE_WIDTH > 0);

  pipes.forEach(p => {
    // collision
    if (
      bird.x + bird.r > p.x &&
      bird.x - bird.r < p.x + PIPE_WIDTH &&
      (bird.y - bird.r < p.top || bird.y + bird.r > canvas.height - p.bottom)
    ) {
      endGame();
    }

    // score
    if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
      p.passed = true;
      score++;
      playScoreSound();
    }
  });
}

// DRAW GAME
function drawScene() {
  // bird
  ctx.beginPath();
  ctx.arc(bird.x, bird.y, bird.r, 0, Math.PI * 2);
  ctx.fillStyle = "#333";
  ctx.fill();

  // pipes
  ctx.fillStyle = "#555";
  pipes.forEach(p => {
    ctx.fillRect(p.x, 0, PIPE_WIDTH, p.top);
    ctx.fillRect(p.x, canvas.height - p.bottom, PIPE_WIDTH, p.bottom);
  });

  // HUD
  ctx.fillStyle = "#000";
  ctx.font = "15px Arial";
  ctx.fillText("Score: " + score, 15, 25);
  ctx.fillText("High: " + highScore, 15, 45);
}

// DRAW
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (gameOver) {
    ctx.save();
    ctx.filter = "blur(6px)";
    drawScene();
    ctx.restore();

    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";

    ctx.font = "24px Arial";
    ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 40);

    ctx.font = "16px Arial";
    ctx.fillText("Score: " + score, canvas.width / 2, canvas.height / 2 - 10);
    ctx.fillText("High Score: " + highScore, canvas.width / 2, canvas.height / 2 + 15);

    ctx.font = "13px Arial";
    if (canRestart) {
      ctx.fillText("Klik / Spasi untuk restart", canvas.width / 2, canvas.height / 2 + 45);
    }

    ctx.textAlign = "left";
  } else {
    drawScene();
  }
}

// LOOP
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// INPUT (unlock audio)
function userInput() {
  if (audioCtx.state === "suspended") audioCtx.resume();

  if (gameOver) {
    if (!canRestart) return;
    resetGame();
  }
  bird.vy = JUMP;
}

document.addEventListener("click", userInput);
document.addEventListener("keydown", e => {
  if (e.code === "Space") userInput();
});

loop();
</script>

</body>
</html>
