<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Pulse Drift - Blur Game Over</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    background: #f2f2f2;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
  }

  canvas {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  }
</style>
</head>
<body>

<canvas id="game" width="360" height="520"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const WALL_HEIGHT = 20;
const GAP_SIZE = 110;
const WALL_DISTANCE = 130;

let player = {
  x: canvas.width / 2,
  y: canvas.height / 2,
  r: 10,
  vx: 3
};

let walls = [];
let speed = 2;
let score = 0;
let highScore = Number(localStorage.getItem("pulseHighScore")) || 0;
let gameOver = false;
let newRecord = false;
let canRestart = false;

function spawnWall() {
  const gapX = Math.random() * (canvas.width - GAP_SIZE);
  walls.push({
    y: -WALL_HEIGHT,
    gapX,
    gapW: GAP_SIZE
  });
}

function resetGame() {
  walls = [];
  speed = 2;
  score = 0;
  player.x = canvas.width / 2;
  gameOver = false;
  newRecord = false;
  canRestart = false;
}

function endGame() {
  gameOver = true;
  canRestart = false;

  if (score > highScore) {
    highScore = score;
    localStorage.setItem("pulseHighScore", highScore);
    newRecord = true;
  }

  // delay 1 detik sebelum bisa restart
  setTimeout(() => {
    canRestart = true;
  }, 1000);
}

function update() {
  if (gameOver) return;

  player.x += player.vx;

  if (player.x < player.r || player.x > canvas.width - player.r) {
    endGame();
  }

  if (walls.length === 0 || walls[walls.length - 1].y > WALL_DISTANCE) {
    spawnWall();
  }

  walls.forEach(w => w.y += speed);
  walls = walls.filter(w => w.y < canvas.height + WALL_HEIGHT);

  walls.forEach(w => {
    if (
      player.y > w.y &&
      player.y < w.y + WALL_HEIGHT &&
      (player.x < w.gapX || player.x > w.gapX + w.gapW)
    ) {
      endGame();
    }
  });

  score++;
  speed += 0.0004;
}

function drawGameScene() {
  // player
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
  ctx.fillStyle = "#333";
  ctx.fill();

  // walls
  ctx.fillStyle = "#555";
  walls.forEach(w => {
    ctx.fillRect(0, w.y, w.gapX, WALL_HEIGHT);
    ctx.fillRect(w.gapX + w.gapW, w.y, canvas.width, WALL_HEIGHT);
  });

  // HUD
  ctx.fillStyle = "#000";
  ctx.font = "15px Arial";
  ctx.fillText("Score: " + score, 15, 25);
  ctx.fillText("High: " + highScore, 15, 45);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (gameOver) {
    // blur background
    ctx.save();
    ctx.filter = "blur(6px)";
    drawGameScene();
    ctx.restore();

    // overlay gelap tipis
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // text GAME OVER
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";

    ctx.font = "24px Arial";
    ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 45);

    ctx.font = "16px Arial";
    ctx.fillText("Score: " + score, canvas.width / 2, canvas.height / 2 - 15);
    ctx.fillText("High Score: " + highScore, canvas.width / 2, canvas.height / 2 + 10);

    if (newRecord) {
      ctx.fillStyle = "#7CFF7C";
      ctx.fillText("NEW RECORD!", canvas.width / 2, canvas.height / 2 + 35);
    }

    ctx.fillStyle = "#ddd";
    ctx.font = "13px Arial";
    if (canRestart) {
      ctx.fillText("Klik / Spasi untuk restart", canvas.width / 2, canvas.height / 2 + 60);
    }

    ctx.textAlign = "left";
  } else {
    drawGameScene();
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

document.addEventListener("click", () => {
  if (gameOver) {
    if (!canRestart) return;
    resetGame();
  }
  player.vx *= -1;
});

document.addEventListener("keydown", e => {
  if (e.code === "Space") {
    if (gameOver) {
      if (!canRestart) return;
      resetGame();
    }
    player.vx *= -1;
  }
});

loop();
</script>

</body>
</html>
