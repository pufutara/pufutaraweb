<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Shadow Jump - Pufutara</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #eaeaea;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: Arial, sans-serif;
}

canvas {
  background: #fff;
  border: 3px solid #000;
  border-radius: 10px;
}

.btn-close {
  position: fixed;
  top: 12px;
  left: 12px;
  width: 38px;
  height: 38px;
  background: #fff;
  border: 2px solid #000;
  border-radius: 50%;
  font-size: 20px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  color: #000;
}
.btn-close:hover {
  background: #000;
  color: #fff;
}
</style>
</head>
<body>

<a href="index.html" class="btn-close">✕</a>

<canvas id="game" width="420" height="420"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player, platforms;
let gravity = 0.45;
let jumpPower = -9;
let speed = 1.2;
let score = 0;
let high = Number(localStorage.getItem("shadowHigh")) || 0;
let gameOver = false;
let started = false;
let canRestart = false;

function reset() {
  player = { x: 210, y: 300, r: 9, vy: 0, side: 1 };
  platforms = [];
  score = 0;
  speed = 1.2;
  gameOver = false;
  canRestart = false;

  for (let i = 0; i < 6; i++) {
    platforms.push({
      x: i % 2 === 0 ? 90 : 260,
      y: 380 - i * 70,
      w: 70,
      h: 10
    });
  }
}

function endGame() {
  gameOver = true;
  if (score > high) {
    high = score;
    localStorage.setItem("shadowHigh", high);
  }
  setTimeout(() => canRestart = true, 1000);
}

/* INPUT */
document.addEventListener("keydown", e => {
  if (e.code === "Space") {
    if (!started) {
      started = true;
      reset();
      return;
    }
    if (gameOver) {
      if (!canRestart) return;
      reset();
      return;
    }
    player.side *= -1;
    player.x = player.side === 1 ? 260 : 90;
  }
});

/* LOOP */
function update() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (!started) {
    ctx.textAlign = "center";
    ctx.fillText("TEKAN SPACE UNTUK MULAI", canvas.width / 2, canvas.height / 2);
    ctx.textAlign = "left";
    requestAnimationFrame(update);
    return;
  }

  if (!gameOver) {
    player.vy += gravity;
    player.y += player.vy;
  }

  platforms.forEach(p => {
    p.y += speed;

    if (
      player.vy > 0 &&
      player.x > p.x &&
      player.x < p.x + p.w &&
      player.y + player.r > p.y &&
      player.y + player.r < p.y + p.h
    ) {
      player.vy = jumpPower;
      score++;
    }
  });

  platforms = platforms.filter(p => p.y < canvas.height + 20);

  if (platforms.length < 7) {
    platforms.push({
      x: Math.random() > 0.5 ? 90 : 260,
      y: -20,
      w: 70,
      h: 10
    });
  }

  if (player.y > canvas.height + 20 && !gameOver) endGame();

  if (!gameOver) speed += 0.0008;

  /* DRAW */
  ctx.fillStyle = "#000";

  // shadow player
  ctx.globalAlpha = 0.25;
  ctx.beginPath();
  ctx.arc(player.x + 4, player.y + 4, player.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
  ctx.fill();

  platforms.forEach(p => {
    ctx.globalAlpha = 0.3;
    ctx.fillRect(p.x + 3, p.y + 3, p.w, p.h);
    ctx.globalAlpha = 1;
    ctx.fillRect(p.x, p.y, p.w, p.h);
  });

  ctx.font = "14px Arial";
  ctx.fillText("Score: " + score, 10, 20);
  ctx.fillText("High: " + high, 10, 36);

  if (gameOver) {
    ctx.save();
    ctx.filter = "blur(6px)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.restore();

    ctx.fillStyle = "#000";
    ctx.textAlign = "center";
    ctx.font = "22px Arial";
    ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);

    ctx.font = "14px Arial";
    ctx.fillText("Score: " + score, canvas.width / 2, canvas.height / 2 + 5);
    ctx.fillText("High Score: " + high, canvas.width / 2, canvas.height / 2 + 25);

    if (canRestart) {
      ctx.font = "12px Arial";
      ctx.fillText("SPACE untuk restart", canvas.width / 2, canvas.height / 2 + 50);
    }
    ctx.textAlign = "left";
  }

  requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
